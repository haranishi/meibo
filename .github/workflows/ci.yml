name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "2"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check default workspace and default app dependency policies
        run: cargo xtask check-all

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Check all workspace targets on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check all cloud integration targets on MSRV
        run: cargo check --workspace --all-targets --locked --features meibo-db/integration-tests,meibo-core/integration-tests,meibo-app/integration-tests

  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install the checksummed synthetic database fixture
        run: |
          sh scripts/install-ci-sqld.sh "$RUNNER_TEMP/meibo-ci-tools"
          echo "MEIBO_SQLD_BINARY=$RUNNER_TEMP/meibo-ci-tools/sqld" >> "$GITHUB_ENV"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build, lint, run every cloud integration target, and audit cloud policies
        run: cargo xtask check-cloud
