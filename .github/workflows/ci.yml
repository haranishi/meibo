name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "2"

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksummed Node and pinned npm
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/meibo-node.tar.xz"
          printf '%s  %s\n' \
            6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 \
            "$RUNNER_TEMP/meibo-node.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/meibo-node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install pinned tooling
        working-directory: cloudflare
        run: npm install --global npm@12.2.1 && npm ci --ignore-scripts
      - name: Check generated types, boundaries, publication gates and shell
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run check
      - name: Build Worker without provider mutations
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy --dry-run --containers-rollout none --outdir "$RUNNER_TEMP/meibo-worker"

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check default workspace and default app dependency policies
        run: cargo xtask check-all

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Check all workspace targets on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check all cloud integration targets on MSRV
        run: cargo check --workspace --all-targets --locked --features meibo-db/integration-tests,meibo-core/integration-tests,meibo-app/integration-tests

  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev
      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install the checksummed synthetic database fixture
        run: |
          sh scripts/install-ci-sqld.sh "$RUNNER_TEMP/meibo-ci-tools"
          echo "MEIBO_SQLD_BINARY=$RUNNER_TEMP/meibo-ci-tools/sqld" >> "$GITHUB_ENV"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build, lint, run every cloud integration target, and audit cloud policies
        run: cargo xtask check-cloud
