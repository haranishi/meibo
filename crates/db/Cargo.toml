[package]
name = "meibo-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
integration-tests = ["tokio/io-util", "tokio/sync"]

[[test]]
name = "foundation"
path = "tests/foundation.rs"
required-features = ["integration-tests"]

[dependencies]
libsql-hrana = "=0.10.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
