[package]
name = "meibo-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
cloud = ["meibo-core/cloud", "dep:meibo-db", "dep:serde", "dep:url"]
integration-tests = ["cloud", "meibo-db/integration-tests", "dep:tokio", "dep:reqwest", "dep:libsql-hrana"]

[[bin]]
name = "meibo"
path = "src/main.rs"

[[test]]
name = "remote_hosted"
path = "tests/remote_hosted.rs"
required-features = ["integration-tests"]

[dependencies]
meibo-db = { path = "../db", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
url = { version = "=2.5.8", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"], optional = true }
libsql-hrana = { version = "=0.10.0", optional = true }
meibo-core = { path = "../core", version = "0.1.0" }
meibo-import = { path = "../import", version = "0.1.0" }
serde_json = "1"
tempfile = "3.27.0"
tiny_http = { version = "0.12.0", default-features = false }
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10.9"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
fs4 = "0.13.1"
