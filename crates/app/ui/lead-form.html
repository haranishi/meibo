<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="/forms/intake.css">
  <script src="/forms/intake.js" defer></script>
</head>
<body>
  <main>
    <header><h1>お問い合わせ</h1><p id="recipient"></p></header>
    <!-- origin-notice -->
    <form id="inquiry" method="post">
      <label for="company">会社・団体名</label>
      <input id="company" name="company_name" autocomplete="organization" required maxlength="200">
      <label for="person">お名前</label>
      <input id="person" name="contact_name" autocomplete="name" required maxlength="100">
      <label for="email">返信先メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      <label for="message">お問い合わせ内容 <span>任意</span></label>
      <textarea id="message" name="message" rows="4" maxlength="1000"></textarea>
      <label class="consent"><input type="checkbox" name="consent" required>
        <span>受付先が、入力内容を問い合わせの記録と返信に利用することに同意します。</span>
      </label>
      <button type="submit" disabled>問い合わせを送信</button>
      <button type="button" id="new-inquiry" hidden>別の問い合わせとして送信</button>
    </form>
    <p id="result" role="status" aria-live="polite" tabindex="-1"></p>
    <noscript>お問い合わせの送信にはJavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
