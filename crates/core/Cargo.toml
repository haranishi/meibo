[package]
name = "meibo-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
cloud = ["dep:meibo-db", "dep:base64", "dep:serde", "dep:serde_json"]
integration-tests = ["cloud", "meibo-db/integration-tests", "dep:tokio", "dep:reqwest", "dep:libsql-hrana"]

[[test]]
name = "remote_lifecycle"
path = "tests/remote_lifecycle.rs"
required-features = ["integration-tests"]

[[test]]
name = "remote_domain"
path = "tests/remote_domain.rs"
required-features = ["integration-tests"]

[[test]]
name = "remote_scans"
path = "tests/remote_scans.rs"
required-features = ["integration-tests"]

[dependencies]
meibo-db = { path = "../db", version = "0.1.0", optional = true }
base64 = { version = "=0.23.1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"], optional = true }
libsql-hrana = { version = "=0.10.0", optional = true }
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
unicode-normalization = "0.1.26"
thiserror = "2.0.21"
fs4 = "0.13.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
