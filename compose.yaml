services:
  app:
    build: .
    image: meibo:local
    command: ["hosted", "${MEIBO_ROOT:-/data/service}", "serve", "--origin", "https://${MEIBO_DOMAIN:?Set MEIBO_DOMAIN to your public domain}", "--bind", "0.0.0.0:4317"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - meibo_data:/data
    networks: [backend]
    mem_limit: 1g
    pids_limit: 128
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MEIBO_DOMAIN: ${MEIBO_DOMAIN:?Set MEIBO_DOMAIN to your public domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    security_opt: [no-new-privileges:true]
networks:
  backend:
volumes:
  meibo_data:
  caddy_data:
  caddy_config:
